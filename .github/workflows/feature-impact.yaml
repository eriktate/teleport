# This workflow runs whenever a pull request is created or updated.
# It reads the PR description and changed files, then uses the feature matrix
# (.github/feature-matrix.yaml) to determine which features are impacted by
# the change and posts a summary comment on the PR.
#
# NOTE: pull_request_target behaves the same as pull_request except it grants a
# read/write token to workflows running on a pull request from a fork. While
# this may seem unsafe, the permissions for the token are limited below and
# the permissions can not be changed without merging to master which is
# protected by CODEOWNERS.
name: Feature Impact Analysis
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

# Limit the permissions on the GitHub token for this workflow to the subset
# that is required. The workflow only needs to post comments on pull requests.
permissions:
  pull-requests: write
  actions: none
  checks: none
  contents: read
  deployments: none
  issues: none
  packages: none
  repository-projects: none
  security-events: none
  statuses: none

jobs:
  feature-impact:
    name: Detect Impacted Features
    if: ${{ !github.event.pull_request.draft && !startsWith(github.head_ref, 'dependabot/') }}
    runs-on: ubuntu-latest
    steps:
      # Checkout the base branch so we can access the feature matrix and script
      # from the repository (not from the potentially untrusted fork HEAD).
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          sparse-checkout: |
            .github/feature-matrix.yaml
            .github/scripts/feature-impact.py
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install pyyaml --quiet

      # Write the PR body to a temp file to avoid shell-injection risks.
      - name: Write PR body to file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > /tmp/pr-body.txt

      # Fetch the list of files changed in this PR via the GitHub API.
      - name: Fetch changed files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repo  = os.environ["REPO"]
          pr    = os.environ["PR_NUMBER"]

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          files = []
          page  = 1
          while True:
              url = f"https://api.github.com/repos/{repo}/pulls/{pr}/files?per_page=100&page={page}"
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req) as resp:
                  batch = json.loads(resp.read())
              files.extend(f["filename"] for f in batch)
              if len(batch) < 100:
                  break
              page += 1

          with open("/tmp/changed-files.txt", "w") as out:
              out.write("\n".join(files))
          print(f"Fetched {len(files)} changed files.")
          EOF

      - name: Analyze feature impact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 .github/scripts/feature-impact.py \
            --matrix .github/feature-matrix.yaml \
            --pr-body /tmp/pr-body.txt \
            --changed-files /tmp/changed-files.txt
